name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      APP_URL: http://localhost:3100
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sekretari
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sekretari_shadow
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sekretari_test
      KEYCLOAK_ISSUER: http://localhost:8080/realms/logos
      KEYCLOAK_CLIENT_ID: sekretari-web
      KEYCLOAK_CLIENT_SECRET: ci-only-secret
      KEYCLOAK_ADMIN_CLIENT_SECRET: ci-only-admin-secret
      BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create test database
        run: psql "postgresql://postgres:postgres@localhost:5432/postgres" -c 'create database sekretari_test'
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm i18n:check
      - run: pnpm test
      - run: pnpm test:coverage
      - name: Build (main only)
        if: github.ref == 'refs/heads/main'
        run: pnpm build
      - run: node scripts/features.mjs --check

  # Build the app image and push it to GHCR once the checks pass on main.
  publish:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      # Optional: Portainer stack webhook that redeploys the stack after a push. Unset = skip.
      PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # BuildKit cache mounts live in the builder and vanish with the runner: persist them between runs.
      - uses: actions/cache@v4
        id: mounts
        with:
          path: |
            mount-next
            mount-pnpm
          key: docker-mounts-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}
          restore-keys: |
            docker-mounts-${{ hashFiles('pnpm-lock.yaml') }}-
            docker-mounts-
      - uses: reproducible-containers/buildkit-cache-dance@v3.4.0
        with:
          cache-map: |
            {
              "mount-next": {"target": "/app/.next/cache", "id": "next"},
              "mount-pnpm": {"target": "/root/.local/share/pnpm/store", "id": "pnpm"}
            }
          skip-extraction: ${{ steps.mounts.outputs.cache-hit }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/app.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Redeploy on Portainer (self-signed certificate, hence -k)
        if: env.PORTAINER_WEBHOOK_URL != ''
        run: curl -fsSk -X POST "$PORTAINER_WEBHOOK_URL"
