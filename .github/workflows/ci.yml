name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: [self-hosted, macOS, ARM64]
    # Public repo, self-hosted machine: never run code from forks.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: ci-check-${{ github.ref }}
      cancel-in-progress: true
    env:
      APP_URL: http://localhost:3100
      DATABASE_URL: postgresql://postgres:postgres@localhost:5544/sekretari
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5544/sekretari_shadow
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5544/sekretari_test
      KEYCLOAK_ISSUER: http://localhost:8080/realms/logos
      KEYCLOAK_CLIENT_ID: sekretari-web
      KEYCLOAK_CLIENT_SECRET: ci-only-secret
      KEYCLOAK_ADMIN_CLIENT_SECRET: ci-only-admin-secret
      BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Service containers are Linux-only, so start an ephemeral Postgres on a port no dev container uses.
      - name: Start Postgres
        run: |
          docker rm -f ci-postgres-${{ github.run_id }} >/dev/null 2>&1 || true
          docker run -d --name ci-postgres-${{ github.run_id }} -p 127.0.0.1:5544:5432 \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres postgres:17-alpine
          until docker exec ci-postgres-${{ github.run_id }} pg_isready -U postgres; do sleep 1; done
      - name: Create test database
        run: docker exec ci-postgres-${{ github.run_id }} psql -U postgres -c 'create database sekretari_test'
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm i18n:check
      - run: pnpm test
      - run: pnpm test:coverage
      - run: pnpm build
      - run: node scripts/features.mjs --check
      - name: Stop Postgres
        if: always()
        run: docker rm -f ci-postgres-${{ github.run_id }} || true

  # Build the app image and push it to GHCR once the checks pass on main.
  publish:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, ARM64]
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      # Optional: Portainer stack webhook that redeploys the stack after a push. Unset = skip.
      PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      # No buildx container builder: the machine's own Docker keeps the layer cache between runs.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/app.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
      - name: Redeploy on Portainer (self-signed certificate, hence -k)
        if: env.PORTAINER_WEBHOOK_URL != ''
        run: curl -fsSk -X POST "$PORTAINER_WEBHOOK_URL"
