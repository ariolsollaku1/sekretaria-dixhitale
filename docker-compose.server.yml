# Portainer stack override for the shared server: publishes Keycloak on loopback only.
# Plain HTTP must not be exposed on the public IP; reach it through an SSH tunnel or a TLS proxy.
# Deployed together with docker-compose.yml (Portainer "additional files").
services:
  keycloak:
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8081}:8080"

  # The app image is built by CI and published to GHCR (.github/workflows/ci.yml); the server
  # only pulls it. Enabled with COMPOSE_PROFILES=full. Public TLS/routing is the shared edge proxy.
  app:
    image: ghcr.io/ariolsollaku1/sekretaria-dixhitale:${APP_IMAGE_TAG:-latest}
    pull_policy: always
    # No .env file on the server: configuration comes from the Portainer stack variables.
    env_file: !reset []
    environment:
      # Public issuer; the app reaches Keycloak internally through KEYCLOAK_INTERNAL_URL (base compose).
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:?set in the Portainer stack variables}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-sekretari-web}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?set in the Portainer stack variables}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?set in the Portainer stack variables}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set in the Portainer stack variables}
