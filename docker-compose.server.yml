# Portainer stack override for the shared server: publishes Keycloak on loopback only.
# Plain HTTP must not be exposed on the public IP; reach it through an SSH tunnel or a TLS proxy.
# Deployed together with docker-compose.yml (Portainer "additional files").
services:
  keycloak:
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8081}:8080"
