# Shared edge proxy (Caddy) for the server: owns ports 80/443 for api.0ec.ai (personal-finance)
# and kc-sd.0ec.ai (Keycloak). Cloudflare terminates public TLS (SSL mode: Full strict);
# Caddy presents the wildcard Cloudflare Origin CA certificate kept in /opt/finance-backend/cert.
# Deployed as its own Portainer stack ("edge"); the Caddyfile is embedded so no repo checkout is needed.
name: edge

services:
  caddy:
    image: caddy:2
    container_name: edge-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /opt/finance-backend/cert:/etc/caddy/ssl:ro
      - caddy-data:/data
      - caddy-config:/config
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    networks:
      - finance
      - sekretaria

configs:
  caddyfile:
    content: |
      {
        # Certificates come from the Cloudflare Origin CA files below; never ask Let's Encrypt.
        auto_https disable_redirects
        servers {
          # Restore the visitor address from CF-Connecting-IP, only on connections from Cloudflare.
          # Ranges: https://www.cloudflare.com/ips-v4/ and /ips-v6/ (as in the former nginx.conf, 2026-09-16)
          trusted_proxies static 173.245.48.0/20 103.21.244.0/22 103.22.200.0/22 103.31.4.0/22 141.101.64.0/18 108.162.192.0/18 190.93.240.0/20 188.114.96.0/20 197.234.240.0/22 198.41.128.0/17 162.158.0.0/15 104.16.0.0/13 104.24.0.0/14 172.64.0.0/13 131.0.72.0/22 2400:cb00::/32 2606:4700::/32 2803:f800::/32 2405:b500::/32 2405:8100::/32 2a06:98c0::/29 2c0f:f248::/32
          client_ip_headers CF-Connecting-IP
        }
      }

      (origin_tls) {
        tls /etc/caddy/ssl/orig.cert /etc/caddy/ssl/origin.key
      }

      http://api.0ec.ai, http://kc-sd.0ec.ai {
        redir https://{host}{uri} permanent
      }

      api.0ec.ai {
        import origin_tls

        # SSE endpoint: no buffering, long timeouts
        @sse path /api/ai/*
        reverse_proxy @sse finance-backend:3000 {
          flush_interval -1
          header_up X-Real-IP {client_ip}
          transport http {
            read_timeout 300s
            write_timeout 300s
          }
        }

        reverse_proxy finance-backend:3000 {
          header_up X-Real-IP {client_ip}
        }
      }

      kc-sd.0ec.ai {
        import origin_tls
        reverse_proxy sekretaria-dixhitale-keycloak-1:8080
      }

networks:
  finance:
    external: true
    name: finance-backend_finance-network
  sekretaria:
    external: true
    name: sekretaria-dixhitale_default

volumes:
  caddy-data:
  caddy-config:
